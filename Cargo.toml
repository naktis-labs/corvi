[workspace]
resolver = "2"
members = [
    "crates/mail-admin",
    "crates/mail-api",
    "crates/mail-bridge",
    "crates/mail-auth",
    "crates/mail-core",
    "crates/mail-config",
    "crates/mail-credential",
    "crates/mail-imap",
    "crates/mail-jmap",
    "crates/mail-operator",
    "crates/corvi-operator",
    "crates/mail-policy",
    "crates/mail-policy-engine",
    "crates/mail-queue",
    "crates/mail-smtp",
    "crates/mail-telemetry",
    "crates/mail-storage",
    "crates/mail-upstream-oauth",
    "crates/provider-migadu",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Naktis Labs"]
repository = "https://github.com/naktis-labs/corvi"
# License is deliberately unset: the project licence is still an open decision
# (ADR-0001 section 14). Publishing is disabled until it is chosen.
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
kube = { version = "2.0", default-features = false, features = ["client", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
k8s-openapi = { version = "0.26", default-features = false, features = ["v1_34"] }
tokio = { version = "1", default-features = false }
regex = "1"
url = "2"
hex = "0.4"
ring = "0.17"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
uninlined_format_args = "allow"

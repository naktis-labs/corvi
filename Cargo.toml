[workspace]
resolver = "2"
members = [
    "crates/mail-core",
    "crates/mail-config",
    "crates/mail-imap",
    "crates/mail-policy",
    "crates/mail-smtp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Naktis Labs"]
repository = "https://github.com/naktis-labs/corvi"
# License is deliberately unset: the project licence is still an open decision
# (ADR-0001 section 14). Publishing is disabled until it is chosen.
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
uninlined_format_args = "allow"

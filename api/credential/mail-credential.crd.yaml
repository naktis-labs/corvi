# DESIGN FIXTURE: the MailCredential CRD shape, not an installed CRD.
#
# ADR-0014 section 2 requires a structural OpenAPI v3 schema with
# `spec.type` defaulted to `smtp`, so Kubernetes applies the default before
# the validating webhook runs. This file records that shape.
#
# It is NOT applied by any release step. Installing it is a privileged
# GitOps/bootstrap action, together with the admission registration and the
# CA bundle, and it is never authorized by the Corvi operator Role.
#
# What this schema can and cannot decide:
#
#   * Local syntax: the protocol vocabulary, the single typed target, the
#     action vocabulary, the Secret template metadata and the `smtp`
#     default are all decidable here.
#   * Cross-resource meaning: whether a scoped credential has a bound
#     gateway and a bound identity, whether a native credential asks for a
#     granularity the provider really isolates, whether the capability
#     status is fresh -- none of that is decidable here. The validating
#     webhook decides it, and the issuer repeats it before every issuance,
#     rotation and publication.
#
# Unknown fields are pruned by the API server rather than rejected, so the
# webhook still refuses the legacy `shape` field explicitly instead of
# letting it disappear silently.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mailcredentials.corvi.naktis.eu
  annotations:
    corvi.naktis.eu/adr: "0014"
spec:
  group: corvi.naktis.eu
  scope: Namespaced
  names:
    plural: mailcredentials
    singular: mailcredential
    kind: MailCredential
    listKind: MailCredentialList
    shortNames:
      - mailcred
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Type
          type: string
          jsonPath: .spec.type
        - name: Target
          type: string
          jsonPath: .spec.targetRef.name
        - name: Mode
          type: string
          jsonPath: .status.connectionMode
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
      schema:
        openAPIV3Schema:
          type: object
          description: >-
            One application credential for Corvi. Exactly one protocol shape,
            exactly one same-namespace target, and at most one generated
            Secret. The presence of spec.permissions asks for Corvi-scoped
            authority; its absence asks for provider-native authority.
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - targetRef
              properties:
                type:
                  type: string
                  description: >-
                    The protocol the credential speaks. Defaults to smtp.
                    Exactly one protocol per credential; an IMAP or JMAP
                    endpoint never implies an MCP or REST credential.
                  enum:
                    - mcp
                    - rest
                    - smtp
                  default: smtp
                targetRef:
                  type: object
                  description: >-
                    The one same-namespace resource the credential is bound
                    to. A gateway-bound provider serves MailIdentity targets
                    only; an unbound provider serves MailIdentity or
                    Mailbox targets, depending on the granularity it really
                    isolates.
                  required:
                    - kind
                    - name
                  properties:
                    kind:
                      type: string
                      enum:
                        - MailIdentity
                        - Mailbox
                    name:
                      type: string
                      minLength: 1
                      maxLength: 63
                      pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                permissions:
                  type: array
                  description: >-
                    The Corvi actions this credential may perform. The
                    presence of this field -- even an empty list -- asks for
                    Corvi-scoped authority, which only a gateway-bound
                    provider can provide.
                  maxItems: 16
                  uniqueItems: true
                  items:
                    type: string
                    enum:
                      - mail:identities:list
                      - mail:messages:list
                      - mail:messages:search
                      - mail:messages:read
                      - mail:attachments:read
                      - mail:messages:send
                      - mail:submissions:read
                      - mail:messages:subscribe
                secretTemplate:
                  type: object
                  description: >-
                    The name and annotations of the generated Secret. No
                    data, no type, no owner references, no other namespace.
                  required:
                    - metadata
                  properties:
                    metadata:
                      type: object
                      properties:
                        name:
                          type: string
                          minLength: 1
                          maxLength: 63
                          pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                        annotations:
                          type: object
                          maxProperties: 32
                          additionalProperties:
                            type: string
                            maxLength: 4096
                      x-kubernetes-validations:
                        - rule: "!has(self.name) || size(self.name) > 0"
                          message: "a Secret name must not be empty"
              x-kubernetes-validations:
                - rule: "!has(self.shape)"
                  message: >-
                    the legacy shape field is not interpreted; a credential
                    declares exactly one protocol shape through spec.type
            status:
              type: object
              description: >-
                Sanitized status. Never a token, a token hash, private mail
                or a password-bearing URL.
              properties:
                observedGeneration:
                  type: integer
                  minimum: 0
                secretRef:
                  type: object
                  properties:
                    name:
                      type: string
                      maxLength: 253
                connectionMode:
                  type: string
                  enum:
                    - gateway
                    - providerDirect
                type:
                  type: string
                  enum:
                    - mcp
                    - rest
                    - smtp
                granularity:
                  type: string
                  enum:
                    - corviIdentity
                    - providerIdentity
                    - providerMailbox
                credentialRevision:
                  type: string
                  maxLength: 256
                conditions:
                  type: array
                  maxItems: 16
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                        enum:
                          - Ready
                          - Issued
                          - Published
                          - RotationPending
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      reason:
                        type: string
                        maxLength: 256
                      message:
                        type: string
                        maxLength: 1024
                      observedGeneration:
                        type: integer
                        minimum: 0
                      lastTransitionTime:
                        type: string
                        format: date-time

# Invalid: an embedded OAuth issuer needs durable state (ADR-0009, ADR-0012).
apiVersion: corvi.naktis.eu/v1alpha1
kind: CorviGateway
metadata:
  name: primary
  namespace: corvi-system
spec:
  replicas: 1
  listeners:
    http:
      enabled: true
    smtpSubmission:
      enabled: false
  authorization:
    mode: embedded
    configSecretRef:
      name: corvi-resource-server
  state:
    backend: ephemeral
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

[package]
name = "mail-policy-engine"
description = "Optional pluggable policy decision engines for Corvi: OCI artifact validation, the typed decision contract and the sandboxed evaluation seam."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
# `wasmparser` validates and inspects policy modules. It is pinned to the
# offline-available 0.245 line; `default-features = false` keeps the optional
# serde/component-model dependency tree out of the build.
wasmparser = { version = "0.245.1", default-features = false, features = [
    "std",
    "validate",
] }

[dev-dependencies]
wasm-encoder = { version = "0.245.1", default-features = false, features = ["std"] }

[lints]
workspace = true

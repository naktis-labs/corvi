# DESIGN FIXTURE: the two credential roles, side by side.
#
# The validating admission webhook and the Secret publisher are separate
# trust roles (ADR-0014 section 6). Neither is on the mail request path,
# and neither role may do the other's job:
#
#   * the validator reads the resource graph and decides. It has no Secret
#     permission at all and may not create, update or patch anything.
#   * the publisher writes the generated Secret. It never adjudicates an
#     admission request and it never issues a credential itself; the issuer
#     hands it material through a protected handoff.
#
# The ValidatingWebhookConfiguration, its HTTPS Service, its serving
# certificate and the CA bundle are NOT here: they are a privileged
# bootstrap/GitOps action, never authorized by the Corvi operator Role.
# See ../examples/mailcredential-validating-webhook.example.yaml.
#
# Normal gateway, OAuth runtime, plugin and bridge Pods keep no Kubernetes
# API token at all.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: corvi-credential-validator
  namespace: corvi-system
  annotations:
    corvi.naktis.eu/role: read-only admission webhook
automountServiceAccountToken: true
---
# Read-only. The webhook resolves the target chain and the capability
# status, and that is all it may do.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: corvi-credential-validator
  namespace: corvi-system
rules:
  - apiGroups: ["corvi.naktis.eu"]
    resources: ["mailidentities", "mailboxes", "mailproviders", "corvigateways"]
    verbs: ["get"]
  - apiGroups: ["corvi.naktis.eu"]
    resources:
      - "mailidentities/status"
      - "mailboxes/status"
      - "mailproviders/status"
      - "corvigateways/status"
    verbs: ["get"]
  # No rule may name "secrets" here, in any verb, and no rule may grant a
  # write on any resource. The webhook cannot issue a token, create a
  # Secret or mutate a resource.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: corvi-credential-validator
  namespace: corvi-system
subjects:
  - kind: ServiceAccount
    name: corvi-credential-validator
    namespace: corvi-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: corvi-credential-validator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: corvi-credential-publisher
  namespace: corvi-system
  annotations:
    corvi.naktis.eu/role: credential Secret publisher
automountServiceAccountToken: true
---
# Writes the generated Secret and nothing else. It may read the credential
# and its parents to revalidate, and it may write the credential's own
# status and finalizer.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: corvi-credential-publisher
  namespace: corvi-system
rules:
  # The generated Secrets. Kubernetes cannot restrict "create" by
  # resourceNames, so the publisher is additionally required to verify the
  # owner UID of every Secret it touches and to fail closed with
  # SecretNameConflict rather than adopt or overwrite a Secret it does not
  # own. There is deliberately no list or watch on secrets.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch", "delete"]
  - apiGroups: ["corvi.naktis.eu"]
    resources: ["mailcredentials"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["corvi.naktis.eu"]
    resources: ["mailcredentials/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["corvi.naktis.eu"]
    resources: ["mailcredentials/finalizers"]
    verbs: ["update"]
  # The parents, for revalidation only.
  - apiGroups: ["corvi.naktis.eu"]
    resources: ["mailidentities", "mailboxes", "mailproviders", "corvigateways"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: corvi-credential-publisher
  namespace: corvi-system
subjects:
  - kind: ServiceAccount
    name: corvi-credential-publisher
    namespace: corvi-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: corvi-credential-publisher

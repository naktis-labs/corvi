# DESIGN ONLY: One MailCredential CRD, validated by an admission webhook.
# Token issuance/Secret publisher and webhook have not been implemented.
# All three active resources use kind: MailCredential and explicit type.
# All outputs use flat Secret.data scalar keys; no JSON credential files.
# Target graph (deploy/examples/mail-resource-chain.example.yaml):
#   me -> personal -> fastmail -> CorviGateway primary
#   noreply -> service -> migadu -> CorviGateway primary
#   unserved-mailbox -> administration-only -> NO gatewayRef
#
# Case 1: Bound provider. Per-identity Corvi-scoped MCP authorization.
apiVersion: corvi.naktis.eu/v1alpha1
kind: MailCredential
metadata:
  name: me-mcp
  namespace: corvi-system
spec:
  type: mcp
  targetRef:
    kind: MailIdentity
    name: me
  permissions:
    - mail:messages:list
    - mail:messages:read
  secretTemplate:
    metadata:
      name: me-mcp-app
      annotations:
        example.com/application: mail-agent
        # Requires explicit Secret annotation policy approval.
        reloader.stakater.com/match: "true"
---
# Case 2: Bound provider. Per-identity Corvi-scoped SMTP AUTH.
apiVersion: corvi.naktis.eu/v1alpha1
kind: MailCredential
metadata:
  name: noreply-submission
  namespace: corvi-system
spec:
  # type omitted: defaults to smtp
  targetRef:
    kind: MailIdentity
    name: noreply
  permissions:
    - mail:messages:send
  # Omitted secretTemplate yields deterministic Secret name.
---
# Case 3: UNBOUND provider. NATIVE WHOLE-MAILBOX SMTP app credential.
# No permissions key at all. This is not a Corvi policy-scoped credential.
# Only valid if provider advertises verified native SMTP app-token issuance
# and entire-mailbox granularity, plus authenticated secret handoff.
apiVersion: corvi.naktis.eu/v1alpha1
kind: MailCredential
metadata:
  name: alerts-direct
  namespace: corvi-system
spec:
  type: smtp
  targetRef:
    kind: Mailbox
    name: unserved-mailbox
  secretTemplate:
    metadata:
      name: alerts-direct-smtp
      annotations:
        example.com/owner: notifications
---
# Additional native per-identity issuance uses SAME MailCredential kind:
# spec:
#   type: smtp
#   targetRef: { kind: MailIdentity, name: unserved }
#   # permissions omitted
# -> allowed ONLY when provider really issues per-identity app tokens
#    and enforces identity-level isolation, otherwise
#    UnsupportedCredentialGranularity / UnsupportedIsolation.
#
# VALIDATING WEBHOOK REJECTION FIXTURES (comments, not applied):
#
# spec:
#   type: mcp
#   targetRef: { kind: MailIdentity, name: unserved }
#   permissions: [mail:messages:read]
# -> GatewayRequiredForScopedCredential: provider has no gatewayRef.
#
# spec:
#   type: smtp
#   targetRef: { kind: Mailbox, name: unserved-mailbox }
#   permissions: []
# -> GatewayRequiredForScopedCredential: presence of permissions forbidden.
#
# spec:
#   type: smtp
#   targetRef: { kind: Mailbox, name: personal }
# -> GatewayRequiresMailIdentity: provider has a gatewayRef.
#
# spec:
#   type: rest
#   targetRef: { kind: MailIdentity, name: me }
#   # permissions omitted
# -> MissingGatewayPermissions: gateway scope requires explicit grants.
#
# Output Secret "me-mcp-app" data keys:
# CONNECTION_TYPE, CONNECTION_MODE, AUTH_TYPE, CREDENTIAL_GRANULARITY,
# PROVIDER_NAME, CREDENTIAL_REVISION, IDENTITY_NAME, MCP_URL,
# OAUTH_TOKEN_URL, OAUTH_CLIENT_ID, OAUTH_CLIENT_SECRET,
# OAUTH_RESOURCE, OAUTH_SCOPES
#
# Output Secret for "noreply-submission" data keys:
# CONNECTION_TYPE, CONNECTION_MODE, AUTH_TYPE, CREDENTIAL_GRANULARITY,
# PROVIDER_NAME, CREDENTIAL_REVISION, IDENTITY_NAME,
# SMTP_HOST, SMTP_PORT, SMTP_TLS_MODE, SMTP_SERVER_NAME,
# SMTP_AUTH_MECHANISM, SMTP_USERNAME, SMTP_PASSWORD, SMTP_FROM_ADDRESS
#
# Output Secret "alerts-direct-smtp" data keys:
# CONNECTION_TYPE, CONNECTION_MODE, AUTH_TYPE, CREDENTIAL_GRANULARITY,
# PROVIDER_NAME, CREDENTIAL_REVISION, MAILBOX_NAME,
# SMTP_HOST, SMTP_PORT, SMTP_TLS_MODE, SMTP_SERVER_NAME,
# SMTP_AUTH_MECHANISM, SMTP_USERNAME, SMTP_PASSWORD, SMTP_FROM_ADDRESS
#
# Individual UTF-8 Kubernetes Secret.data values, not YAML with real tokens.
# Admission is no substitute for issuance-time / parent-change revalidation.

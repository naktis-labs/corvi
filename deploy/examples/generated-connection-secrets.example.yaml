# DESIGN ONLY: MailCredential credential issuance/Secret publishing is not implemented.
# These resources show the reusable secretTemplate contract described by ADR-0014.
# Both refs are from deploy/examples/mail-resource-chain.example.yaml:
# - "me" -> "personal" -> "fastmail" -> gatewayRef "primary" (gateway mode)
# - "unserved" -> "unserved-mailbox" -> "administration-only" (NO gatewayRef)
# A direct app token is issued ONLY if the provider can issue a suitably
# scoped independent credential and preserve identity visibility restrictions.
#
# The actual operator writes an Opaque Secret with data["connection.json"] and
# (optionally) protocol-specific Secret keys. NO secret values belong in YAML
# GitOps manifests, annotations or status. The Secret namespace is fixed.
apiVersion: corvi.naktis.eu/v1alpha1
kind: MailCredential
metadata:
  name: personal-client
  namespace: corvi-system
spec:
  identityRefs:
    - name: me
  permissions:
    - mail:messages:list
    - mail:messages:read
    - mail:messages:send
  connection:
    strategy: auto
  secretTemplate:
    metadata:
      name: personal-mail-app
      annotations:
        example.com/application: example-notifications
        # Requires operator/admin annotation policy approval.
        reloader.stakater.com/match: "true"
---
# Provider-only credential: no CorviGateway needed. This should yield the
# provider's *verified* IMAP/SMTP/JMAP details and newly issued app credentials,
# not a Corvi bearer token, only when this provider supports safe issuance.
# A physical Mailbox app password must NOT be used to circumvent MailIdentity
# filtering or sender restrictions. Unsupported cases become status conditions.
apiVersion: corvi.naktis.eu/v1alpha1
kind: MailCredential
metadata:
  name: direct-service
  namespace: corvi-system
spec:
  identityRefs:
    - name: unserved
  permissions:
    - mail:messages:send
  connection:
    strategy: auto
  secretTemplate:
    metadata:
      name: direct-service-mail
      annotations:
        example.com/owner: notifications-service
---
# Custom secret name may be omitted; the publisher computes a stable name.
# Omitting secretTemplate entirely also uses the default name and annotations.
# A Secret name collision with an unrelated Secret is NOT automatically adopted.
#
# Example decoded data["connection.json"] (illustrative only, not raw YAML data):
# Bound "personal-client":
#   mode: gateway
#   services.rest.url: https://mail.example.test/v1
#   services.mcp.url: https://mail.example.test/mcp
#   auth.oauth.tokenUrl: https://auth.example.test/oauth/token
#   auth.oauth.clientId / clientSecret / resource / scopes: generated & scoped
# Direct "direct-service" (only if capability and isolation checks succeed):
#   mode: providerDirect
#   services.smtp.host / port / tls: resolved from actual provider descriptor
#   auth.smtp.username / secret / type: provider-issued app credential
#   identity.id: unserved
# There is no silent switch to direct mode when a bound gateway goes offline.

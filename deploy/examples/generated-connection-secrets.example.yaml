# DESIGN ONLY: credential CRDs, provider issuance and Secret publishing are not implemented.
# These are three independent credentials, each with ONE explicit shape and ONE Secret.
# Only Secret.data individual keys are emitted. NO credentials.json/connection.json.
# Graph refs come from deploy/examples/mail-resource-chain.example.yaml:
# - me -> personal -> fastmail -> gatewayRef primary
# - noreply -> service -> migadu -> gatewayRef primary
# - unserved-mailbox -> administration-only -> NO gatewayRef
#
# Scoped Corvi credential: valid ONLY with a ready bound gateway.
apiVersion: corvi.naktis.eu/v1alpha1
kind: MailCredential
metadata:
  name: me-mcp
  namespace: corvi-system
spec:
  shape: mcp
  identityRef:
    name: me
  permissions:
    - mail:messages:list
    - mail:messages:read
  secretTemplate:
    metadata:
      name: me-mcp-app
      annotations:
        example.com/application: mail-agent
        # Subject to explicit annotation policy; no unsafe secret replication.
        reloader.stakater.com/match: "true"
---
# Another Corvi credential with a separate, explicitly SMTP-shaped Secret.
# In v1alpha1 a generated credential has only one target identity and shape.
apiVersion: corvi.naktis.eu/v1alpha1
kind: MailCredential
metadata:
  name: noreply-submission
  namespace: corvi-system
spec:
  shape: smtp
  identityRef:
    name: noreply
  permissions:
    - mail:messages:send
  # Omitted secretTemplate gives a stable deterministic Secret name.
---
# Gatewayless provider: app credential issued NATIVELY by upstream provider.
# This is MAILBOX-wide, NOT Corvi policy-scoped and NOT a MailCredential.
# Only valid if administration-only's provider plugin supports independent
# mailbox-granularity SMTP app-password issuance and revocation/handoff.
apiVersion: corvi.naktis.eu/v1alpha1
kind: ProviderAppCredential
metadata:
  name: alerts-direct
  namespace: corvi-system
spec:
  shape: smtp
  targetRef:
    kind: Mailbox
    name: unserved-mailbox
  secretTemplate:
    metadata:
      name: alerts-direct-smtp
      annotations:
        example.com/owner: notifications
---
# IMPORTANT REJECTION EXAMPLES, deliberately NOT active resources:
#
# kind: MailCredential
# spec:
#   shape: mcp
#   identityRef: { name: unserved }
#   permissions: [mail:messages:read]
# -> GatewayRequiredForScopedCredential. NO generated Secret.
#
# kind: ProviderAppCredential
# spec:
#   shape: smtp
#   targetRef: { kind: MailIdentity, name: unserved }
# -> UnsupportedCredentialGranularity if provider only issues mailbox tokens.
#
# kind: ProviderAppCredential
# spec:
#   shape: smtp
#   targetRef: { kind: Mailbox, name: personal }
# -> GatewayBoundUseMailCredential; no gateway bypass.
#
# Output me-mcp-app Secret.data keys:
# CONNECTION_SHAPE, CONNECTION_MODE, AUTH_TYPE, CREDENTIAL_GRANULARITY,
# PROVIDER_NAME, CREDENTIAL_REVISION, IDENTITY_NAME, MCP_URL,
# OAUTH_TOKEN_URL, OAUTH_CLIENT_ID, OAUTH_CLIENT_SECRET,
# OAUTH_RESOURCE, OAUTH_SCOPES
#
# Output noreply-submission Secret.data keys:
# CONNECTION_SHAPE, CONNECTION_MODE, AUTH_TYPE, CREDENTIAL_GRANULARITY,
# PROVIDER_NAME, CREDENTIAL_REVISION, IDENTITY_NAME,
# SMTP_HOST, SMTP_PORT, SMTP_TLS_MODE, SMTP_SERVER_NAME,
# SMTP_AUTH_MECHANISM, SMTP_USERNAME, SMTP_PASSWORD, SMTP_FROM_ADDRESS
#
# Output alerts-direct-smtp Secret.data keys:
# CONNECTION_SHAPE, CONNECTION_MODE, AUTH_TYPE, CREDENTIAL_GRANULARITY,
# PROVIDER_NAME, CREDENTIAL_REVISION, MAILBOX_NAME,
# SMTP_HOST, SMTP_PORT, SMTP_TLS_MODE, SMTP_SERVER_NAME,
# SMTP_AUTH_MECHANISM, SMTP_USERNAME, SMTP_PASSWORD, SMTP_FROM_ADDRESS
#
# Individual UTF-8 Secret.data values, not YAML manifests containing real
# tokens and not any JSON secret file. Values are resolved from verified
# issuer/provider transport descriptors and stored only in owned Secrets.

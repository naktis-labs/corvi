# Design fixture: these CRDs and runtime reconciliation are NOT implemented.
# Parent reference contract; MailProvider/Mailbox/MailIdentity contain only
# reference fields here, not yet complete provider transport/address settings.
# All four resources MUST live in one namespace. Never mirror child lists on gateway.
apiVersion: corvi.naktis.eu/v1alpha1
kind: CorviGateway
metadata:
  name: primary
  namespace: corvi-system
spec:
  replicas: 2
  listeners:
    http:
      enabled: true
    smtpSubmission:
      enabled: false
  authorization:
    mode: external
    configSecretRef:
      name: corvi-resource-server
  state:
    backend: postgres
    connectionSecretRef:
      name: corvi-runtime-db
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
      ephemeral-storage: 256Mi
---
apiVersion: corvi.naktis.eu/v1alpha1
kind: MailProvider
metadata:
  name: fastmail
  namespace: corvi-system
spec:
  gatewayRef:
    name: primary
---
apiVersion: corvi.naktis.eu/v1alpha1
kind: MailProvider
metadata:
  name: migadu
  namespace: corvi-system
spec:
  gatewayRef:
    name: primary
---
# This provider has NO gatewayRef: management-only, no mail-serving gateway.
# It does not need a CorviGateway object or running gateway Pod.
apiVersion: corvi.naktis.eu/v1alpha1
kind: MailProvider
metadata:
  name: administration-only
  namespace: corvi-system
spec: {}
---
apiVersion: corvi.naktis.eu/v1alpha1
kind: Mailbox
metadata:
  name: personal
  namespace: corvi-system
spec:
  providerRef:
    name: fastmail
---
apiVersion: corvi.naktis.eu/v1alpha1
kind: Mailbox
metadata:
  name: service
  namespace: corvi-system
spec:
  providerRef:
    name: migadu
---
apiVersion: corvi.naktis.eu/v1alpha1
kind: MailIdentity
metadata:
  name: me
  namespace: corvi-system
spec:
  mailboxRef:
    name: personal
---
apiVersion: corvi.naktis.eu/v1alpha1
kind: MailIdentity
metadata:
  name: noreply
  namespace: corvi-system
spec:
  mailboxRef:
    name: service

---
# An unbound provider can own mailboxes and identities without exposing them.
apiVersion: corvi.naktis.eu/v1alpha1
kind: Mailbox
metadata:
  name: unserved-mailbox
  namespace: corvi-system
spec:
  providerRef:
    name: administration-only
---
apiVersion: corvi.naktis.eu/v1alpha1
kind: MailIdentity
metadata:
  name: unserved
  namespace: corvi-system
spec:
  mailboxRef:
    name: unserved-mailbox

# CorviGateway "primary" serves "me" and "noreply" through the resolved
# graph. A separate CorviGateway is not authorized to expose those identities.
# Per-client OAuth grants still control which of the two identities it may use.
# MailProvider administration-only has no gatewayRef and never exposes
# unserved-mailbox/unserved to any gateway. Management still works.
# CorviGateway.spec.suspended: true remains an optional temporary
# mail-serving pause for already-bound providers, not a requirement.

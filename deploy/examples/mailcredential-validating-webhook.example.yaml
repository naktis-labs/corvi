# DESIGN FIXTURE ONLY. Not a deployed webhook, usable certificate or released CRD.
# Registered by a trusted bootstrap/GitOps identity, NOT the Corvi operator.
# Requires a separately managed, rootless HTTPS webhook Service/Deployment,
# CA injection, ServiceAccount and corresponding read-only Role/RoleBinding.
# The webhook validates MailCredential CREATE and UPDATE only; it MUST NOT
# issue tokens, create Secrets, call provider CreateAppToken, or run on mail traffic.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: corvi-mailcredential
  annotations:
    # When using cert-manager cainjector, provision an appropriate Certificate
    # and enable correct CA trust injection. Example Certificate name only.
    cert-manager.io/inject-ca-from: corvi-system/corvi-credential-validator-tls
webhooks:
  - name: mailcredentials.corvi.naktis.eu
    admissionReviewVersions:
      - v1
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: 5
    clientConfig:
      service:
        namespace: corvi-system
        name: corvi-credential-validator
        path: /validate/v1alpha1/mailcredential
        port: 443
      # caBundle populated at install time by the trusted CA injector.
    rules:
      - apiGroups: [corvi.naktis.eu]
        apiVersions: [v1alpha1]
        operations: [CREATE, UPDATE]
        resources: [mailcredentials]
        scope: Namespaced
    # No objectSelector/namespaceSelector exclusions that let a credential
    # bypass the webhook. Installer uses restricted RBAC/admission separately.
---
# Dedicated read-only admission webhook Role, NOT Secret writer.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: corvi-credential-validator
  namespace: corvi-system
rules:
  - apiGroups: [corvi.naktis.eu]
    resources: [mailidentities, mailboxes, mailproviders, corvigateways]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: corvi-credential-validator
  namespace: corvi-system
subjects:
  - kind: ServiceAccount
    name: corvi-credential-validator
    namespace: corvi-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: corvi-credential-validator

# Separate, non-root webhook SA/Deployment/Service are provisioned by a
# trusted app-template release. The webhook's SA needs a projected API token
# for named get operations; it must not have any Secret create/get/list/watch.
# Admission can't automatically revisit a credential on parent CRD changes:
# operator/publisher MUST revalidate before issuing/rotating and revoke unsafe
# credentials when provider/mailbox/identity/gateway relationships change.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: corvi-gateway-primary
  namespace: corvi-system
  labels:
    app.kubernetes.io/component: gateway
    app.kubernetes.io/instance: primary
    app.kubernetes.io/managed-by: corvi-operator
    app.kubernetes.io/name: corvi-gateway
    corvi.naktis.eu/gateway: primary
  annotations: {}
  ownerReferences:
  - apiVersion: corvi.naktis.eu/v1alpha1
    kind: CorviGateway
    name: primary
    uid: 00000000-0000-0000-0000-000000000001
    controller: true
    blockOwnerDeletion: true
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: corvi-gateway
  strategy:
    kind: RollingUpdate
  template:
    metadata:
      name: ''
      namespace: corvi-system
      labels:
        app.kubernetes.io/component: gateway
        app.kubernetes.io/instance: primary
        app.kubernetes.io/managed-by: corvi-operator
        app.kubernetes.io/name: corvi-gateway
        corvi.naktis.eu/gateway: primary
      annotations: {}
    spec:
      serviceAccountName: corvi-gateway
      automountServiceAccountToken: false
      enableServiceLinks: false
      hostNetwork: false
      hostPid: false
      hostIpc: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          kind: RuntimeDefault
      containers:
      - name: gateway
        image: ghcr.io/naktis-labs/corvi-gateway@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: smtp-submission
          containerPort: 2525
          protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          capabilities:
            drop:
            - ALL
            add: []
          seccompProfile:
            kind: RuntimeDefault
          procMount: Default
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
            ephemeral-storage: 256Mi
        volumeMounts:
        - name: config
          mountPath: /etc/corvi
          readOnly: true
        - name: tmp
          mountPath: /tmp
          readOnly: false
      volumes:
      - name: config
        source: !configMap
          name: corvi-gateway-primary-config
      - name: tmp
        source: !emptyDir
          medium: Memory
          size_limit: 32Mi
